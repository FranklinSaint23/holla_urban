name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Holla Urban on Render
        run: |
          echo "Pinging Holla Urban..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_WEB_URL }}" --max-time 30)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: service returned HTTP $STATUS"
            exit 1
          fi
          echo "Service is alive!"
