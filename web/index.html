<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HOLLA – Livraison urbaine intelligente au Cameroun">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HOLLA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>HOLLA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0D0D1A; }
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0D0D1A;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 56px;
      height: 56px;
      border: 3px solid rgba(108,92,231,0.2);
      border-top: 3px solid #6C5CE7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-msg {
      margin-top: 20px;
      color: rgba(255,255,255,0.6);
      font-family: sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    #err-msg {
      display: none;
      margin-top: 12px;
      color: #ff6b6b;
      font-family: monospace;
      font-size: 11px;
      text-align: center;
      max-width: 340px;
      background: rgba(255,0,0,0.1);
      padding: 8px 12px;
      border-radius: 8px;
      word-break: break-all;
    }
    #reload-btn {
      display: none;
      margin-top: 16px;
      padding: 10px 24px;
      background: #6C5CE7;
      color: white;
      border: none;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p id="status-msg">Chargement de HOLLA...</p>
    <p id="err-msg"></p>
    <button id="reload-btn" onclick="location.reload(true)">Recharger</button>
  </div>

  <script>
    function setStatus(msg) {
      var el = document.getElementById('status-msg');
      if (el) el.textContent = msg;
    }

    function showError(msg) {
      var err = document.getElementById('err-msg');
      var btn = document.getElementById('reload-btn');
      var spin = document.querySelector('.spinner');
      if (err) { err.style.display = 'block'; err.textContent = msg; }
      if (btn) btn.style.display = 'block';
      if (spin) spin.style.borderTopColor = '#ff6b6b';
    }

    // Catch any JavaScript errors
    window.onerror = function(msg, src, line, col, err) {
      showError('JS Error: ' + msg + (src ? ' @ ' + src.split('/').pop() + ':' + line : ''));
      return false;
    };

    window.addEventListener('unhandledrejection', function(e) {
      var reason = e.reason ? (e.reason.message || String(e.reason)) : 'Promise rejected';
      showError('Async error: ' + reason);
    });

    // Unregister old service workers (from pre-pwa-strategy=none builds)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        if (regs.length > 0) {
          setStatus('Nettoyage du cache...');
          return Promise.all(regs.map(function(r) { return r.unregister(); }));
        }
      }).then(function() {
        setStatus('Chargement de HOLLA...');
      });
    }

    // Hide loading screen once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) el.classList.add('hidden');
    });

    // Show error if Flutter hasn't started within 25 seconds
    var _hollaTimeout = setTimeout(function() {
      showError('Timeout: Flutter ne démarre pas. Connexion lente ou erreur interne.');
    }, 25000);

    window.addEventListener('flutter-first-frame', function() {
      clearTimeout(_hollaTimeout);
    });

    setStatus('Initialisation du moteur...');
  </script>

  <!-- Google Maps (async to avoid blocking Flutter) -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDqJtH6hpF1i1ct9qHzKsqHh4wzMwZTzfw">
  </script>

  <script>
    // Log when flutter_bootstrap.js starts loading
    setStatus('Chargement du moteur Flutter...');
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
