<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HOLLA – Livraison urbaine intelligente au Cameroun">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HOLLA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>HOLLA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0D0D1A; }
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0D0D1A;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 56px;
      height: 56px;
      border: 3px solid rgba(108,92,231,0.2);
      border-top: 3px solid #6C5CE7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p {
      margin-top: 20px;
      color: rgba(255,255,255,0.6);
      font-family: sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    #loading .err {
      display: none;
      margin-top: 12px;
      color: #ff6b6b;
      font-family: sans-serif;
      font-size: 12px;
      text-align: center;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Chargement de HOLLA...</p>
    <p class="err" id="err-msg"></p>
  </div>

  <script>
    // Unregister any old service workers (from previous builds before --pwa-strategy=none)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) { reg.unregister(); });
      });
    }

    // Hide loading screen once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) { el.classList.add('hidden'); }
    });

    // Show error if Flutter fails to start within 30s
    var _hollaTimeout = setTimeout(function() {
      var msg = document.getElementById('err-msg');
      if (msg) {
        msg.style.display = 'block';
        msg.textContent = 'Erreur de chargement. Vérifiez votre connexion et rechargez.';
      }
    }, 30000);

    // Clear timeout when Flutter starts
    window.addEventListener('flutter-first-frame', function() {
      clearTimeout(_hollaTimeout);
    });
  </script>

  <!-- Google Maps (async to avoid blocking Flutter) -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDqJtH6hpF1i1ct9qHzKsqHh4wzMwZTzfw">
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
