<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HOLLA – Livraison urbaine intelligente au Cameroun">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HOLLA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>HOLLA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0D0D1A; }
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0D0D1A;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border: 3px solid rgba(108,92,231,0.2);
      border-top: 3px solid #6C5CE7;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p {
      margin-top: 20px;
      color: rgba(255,255,255,0.6);
      font-family: sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Chargement de HOLLA...</p>
  </div>

  <!-- Google Maps (async pour ne pas bloquer Flutter) -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDqJtH6hpF1i1ct9qHzKsqHh4wzMwZTzfw">
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
