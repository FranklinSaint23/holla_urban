    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
